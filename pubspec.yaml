name: merry_go_round_carousel
description: "A 3D rotating carousel for Flutter: a spinning ring of cards with swipe momentum, snapping, tap-to-front, auto-rotate and a controller. Works on mobile, web and desktop."
version: 0.4.1
homepage: https://boffincoders.github.io/merry_go_round_carousel/
repository: https://github.com/boffincoders/merry_go_round_carousel
issue_tracker: https://github.com/boffincoders/merry_go_round_carousel/issues
screenshots:
  - description: A 3D merry-go-round carousel spinning on a phone, with swipe, tap-to-front and auto-rotate.
    path: screenshots/demo_mobile.gif

topics:
  - carousel
  - slider
  - gallery
  - animation
  - gestures

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0


